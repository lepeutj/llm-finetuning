project:
  seed: 42
  model_name: Qwen/Qwen2.5-1.5B-Instruct
  model_revision: null

quantization:
  mode: nf4
  double_quant: true

data:
  dataset_name: NousResearch/hermes-function-calling-v1
  dataset_subset: func_calling_singleturn
  # Pin the source so the normalized splits remain reproducible.
  dataset_revision: dae3e1d28cfbcf4b915c04ea1e072030529b4bda
  train_path: data/hermes/train.jsonl
  validation_path: data/hermes/validation.jsonl
  test_path: data/hermes/test.jsonl
  train_size: 500
  validation_size: 100
  test_size: 150

generation:
  max_new_tokens: 256
  do_sample: false

training:
  results_dir: results/hermes
  num_train_epochs: 2
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 8
  gradient_checkpointing: true
  learning_rate: 0.00015
  max_seq_length: 1024
  lora_r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  lora_target_modules: [q_proj, v_proj]
